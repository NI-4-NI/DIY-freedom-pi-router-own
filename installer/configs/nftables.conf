#!/usr/sbin/nft -f
# freedom-pi nftables ruleset
# loaded at boot by: systemctl start nftables
# applied immediately by: nft -f /etc/nftables.conf

flush ruleset

# IPv4 NAT: all traffic leaving via the WAN port appears to come from
# one IP address. Without this, LAN devices cannot reach the internet.
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oif "eth1" masquerade
    }
}

# "inet" covers both IPv4 and IPv6 in a single table.
table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # The Pi talking to itself.
        iif lo accept

        # Replies to connections the Pi already opened.
        ct state established,related accept

        # LAN port (eth0): SSH, DHCP, DNS, Pi-hole web UI, Cockpit, Webmin, ping.
        # In an inet table one rule covers both IPv4 and IPv6.
        iif "eth0" tcp dport 22 accept
        iif "eth0" udp dport { 67, 68 } accept
        iif "eth0" tcp dport 53 accept
        iif "eth0" udp dport 53 accept
        iif "eth0" tcp dport 80 accept
        iif "eth0" tcp dport 443 accept
        iif "eth0" tcp dport 9090 accept
        iif "eth0" tcp dport 10000 accept
        iif "eth0" ip protocol icmp accept

        # WiFi AP (wlan0): same ports as LAN.
        iif "wlan0" tcp dport 22 accept
        iif "wlan0" udp dport { 67, 68 } accept
        iif "wlan0" tcp dport 53 accept
        iif "wlan0" udp dport 53 accept
        iif "wlan0" tcp dport 80 accept
        iif "wlan0" tcp dport 443 accept
        iif "wlan0" tcp dport 9090 accept
        iif "wlan0" tcp dport 10000 accept
        iif "wlan0" ip protocol icmp accept

        # ICMPv6 must be accepted on all interfaces or IPv6 breaks entirely.
        # This is the IPv6 equivalent of ARP and cannot be interface-restricted.
        meta nfproto ipv6 icmpv6 accept

        # DHCPv6 client: the Pi requesting its own IPv6 address from the ISP.
        udp dport 546 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Return traffic for connections LAN/WiFi already opened.
        ct state established,related accept

        # LAN -> WAN.
        iif "eth0" oif "eth1" accept

        # WiFi -> WAN.
        iif "wlan0" oif "eth1" accept
    }

    # Outbound from the Pi itself: always allowed.
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
